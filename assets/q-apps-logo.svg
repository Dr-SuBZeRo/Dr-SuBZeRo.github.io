<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="90 140 840 700" role="img" aria-labelledby="title desc">
  <title id="title">Q Apps by SuBZeRo</title>
  <desc id="desc">The complete silver and electric-blue Q Apps emblem with code brackets and an orbital swoosh.</desc>
  <style>
    .orbit-track {
      transform-box: view-box;
      transform-origin: 512px 512px;
      animation: orbital-drift 34s linear infinite;
    }
    .q-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: ring-glint 7s ease-in-out infinite;
    }
    .q-tail {
      transform-box: fill-box;
      transform-origin: center;
      animation: tail-glow 5.5s ease-in-out infinite;
    }
    .code-glyph {
      stroke-dasharray: 460;
      stroke-dashoffset: 0;
      animation: code-current 8s ease-in-out infinite;
    }
    @keyframes orbital-drift {
      to { transform: rotate(360deg); }
    }
    @keyframes ring-glint {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.12); }
    }
    @keyframes tail-glow {
      0%, 100% { filter: url(#glow) brightness(1); }
      50% { filter: url(#glow) brightness(1.18); }
    }
    @keyframes code-current {
      0%, 100% { stroke-dashoffset: 0; opacity: 1; }
      50% { stroke-dashoffset: -230; opacity: .82; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-track, .q-ring, .q-tail, .code-glyph { animation: none !important; }
    }
  </style>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%"><stop offset="0" stop-color="#09234b"/><stop offset=".58" stop-color="#03132f"/><stop offset="1" stop-color="#01091d"/></radialGradient>
    <linearGradient id="silver" x1=".1" y1="0" x2=".9" y2="1"><stop stop-color="#fff"/><stop offset=".28" stop-color="#dce8f8"/><stop offset=".58" stop-color="#879bb9"/><stop offset=".82" stop-color="#f5f9ff"/><stop offset="1" stop-color="#a8c5e8"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00e7ff"/><stop offset=".42" stop-color="#078cff"/><stop offset="1" stop-color="#063bcb"/></linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00eaff"/><stop offset=".48" stop-color="#0878ff"/><stop offset="1" stop-color="#00d8ff"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="13"/><feOffset dy="13"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- orbital sweep behind the emblem -->
  <g class="orbit-track">
    <path d="M205 570 C112 538 147 456 282 386 C421 314 615 293 779 348 C861 375 891 418 849 466" fill="none" stroke="#006cff" stroke-width="28" opacity=".18" filter="url(#glow)"/>
    <path d="M205 570 C112 538 147 456 282 386 C421 314 615 293 779 348 C861 375 891 418 849 466" fill="none" stroke="url(#orbit)" stroke-width="15" stroke-linecap="round"/>
    <path d="M817 579 C904 540 892 475 810 431" fill="none" stroke="url(#orbit)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  </g>
  <!-- Q ring -->
  <g class="q-ring" filter="url(#shadow)">
    <path d="M512 170 C334 170 190 314 190 492 C190 670 334 814 512 814 C690 814 834 670 834 492 C834 314 690 170 512 170 Z M512 298 C619 298 706 385 706 492 C706 599 619 686 512 686 C405 686 318 599 318 492 C318 385 405 298 512 298 Z" fill="url(#silver)" fill-rule="evenodd"/>
    <path d="M512 170 C334 170 190 314 190 492 C190 670 334 814 512 814 C690 814 834 670 834 492 C834 314 690 170 512 170 Z" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="4"/>
  </g>
  <!-- blue Q tail -->
  <path class="q-tail" d="M476 596 C555 568 617 585 678 642 L846 806 C779 810 711 802 665 769 C611 730 559 658 476 596 Z" fill="url(#blue)" stroke="#21e5ff" stroke-width="4" filter="url(#glow)"/>
  <path d="M480 595 C553 574 611 592 674 648" fill="none" stroke="#d6fbff" stroke-opacity=".8" stroke-width="5"/>
  <!-- code glyph -->
  <g class="code-glyph" fill="none" stroke="url(#orbit)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
    <path d="M449 405 L397 448 L449 491"/>
    <path d="M575 405 L627 448 L575 491"/>
    <path d="M540 384 L484 512"/>
  </g>
  <path d="M449 405 L397 448 L449 491 M575 405 L627 448 L575 491 M540 384 L484 512" fill="none" stroke="#eafaff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>